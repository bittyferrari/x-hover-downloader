<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>X Image &amp; Video Downloader — 設定</title>
    <style>
      :root {
        --bg: #15202b;
        --card: #1c2732;
        --line: #38444d;
        --text: #e7e9ea;
        --sub: #8b98a5;
        --blue: #1d9bf0;
        --green: #00ba7c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px 20px 48px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      }
      .wrap { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .lead { color: var(--sub); font-size: 13px; margin: 0 0 24px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 6px 18px;
        margin-bottom: 20px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child { border-bottom: none; }
      .row .label { font-size: 15px; font-weight: 600; }
      .row .desc { font-size: 12px; color: var(--sub); margin-top: 3px; }
      input[type="number"] {
        width: 92px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0c141d;
        color: var(--text);
        font-size: 15px;
        text-align: right;
      }
      .unit { color: var(--sub); font-size: 13px; margin-left: 6px; }
      /* toggle */
      .switch { position: relative; width: 46px; height: 26px; flex: none; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; cursor: pointer;
        background: #3a4a58; border-radius: 999px; transition: 0.2s;
      }
      .slider::before {
        content: ""; position: absolute; height: 20px; width: 20px;
        left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
      }
      .switch input:checked + .slider { background: var(--green); }
      .switch input:checked + .slider::before { transform: translateX(20px); }
      .actions { display: flex; align-items: center; gap: 12px; }
      button {
        border: none; border-radius: 999px; cursor: pointer;
        font-size: 14px; font-weight: 700; padding: 10px 20px;
      }
      #save { background: var(--blue); color: #fff; }
      #save:hover { background: #1a8cd8; }
      #reset {
        background: transparent; color: var(--sub);
        border: 1px solid var(--line);
      }
      #reset:hover { color: var(--text); }
      #status { font-size: 13px; color: var(--green); opacity: 0; transition: opacity 0.2s; }
      #status.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>X Image &amp; Video Downloader</h1>
      <p class="lead">設定變更會即時套用,不需要重新載入分頁。</p>

      <div class="card">
        <div class="row">
          <div>
            <div class="label">圖片下載</div>
            <div class="desc">在圖片上做手勢時下載</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="ENABLE_IMAGE" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="row">
          <div>
            <div class="label">影片下載</div>
            <div class="desc">在影片上做手勢時下載</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="ENABLE_VIDEO" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <div class="label">手勢次數</div>
            <div class="desc">over→out 要做幾次才觸發下載</div>
          </div>
          <div><input type="number" id="GESTURE_CYCLES" min="1" max="10" step="1" /><span class="unit">次</span></div>
        </div>
        <div class="row">
          <div>
            <div class="label">時間範圍</div>
            <div class="desc">上面那幾次要在幾秒內完成</div>
          </div>
          <div><input type="number" id="GESTURE_WINDOW_SECONDS" min="0.3" max="10" step="0.1" /><span class="unit">秒</span></div>
        </div>
        <div class="row">
          <div>
            <div class="label">冷卻時間</div>
            <div class="desc">同一張圖/影片觸發後,幾秒內不再重複</div>
          </div>
          <div><input type="number" id="COOLDOWN_SECONDS" min="0" max="30" step="0.5" /><span class="unit">秒</span></div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <div class="label">多圖攤平成網格</div>
            <div class="desc">把 X 的左右滑動 carousel 改成一次看得到全部</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="GRID_MEDIA" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="row">
          <div>
            <div class="label">網格欄數</div>
            <div class="desc">2 = 每張約 50% 寬</div>
          </div>
          <div><input type="number" id="GRID_COLUMNS" min="1" max="6" step="1" /><span class="unit">欄</span></div>
        </div>
      </div>

      <div class="actions">
        <button id="save">儲存</button>
        <button id="reset">還原預設值</button>
        <span id="status">已儲存 ✔</span>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
